datasets:
- file: bird_center_latitude_change.csv
  figure: Figure 1
  figure_title: Figure 1. Change in Latitude of Bird Center of Abundance, 1966-2013
  source_file: bird-ranges_fig-1.csv
  source_sha256: b2c9432fdef5003a74fc6c5c4eb6a9f7d9337053325ac61ee5d9e16265a1b099
